{% extends "bincom_app/base.html" %}{% block content %}<div class="card"><h2>Question 1</h2><form method="get">{{form.as_p}}<button>View Result</button></form></div>{% if result %}<div class="card"><h3>{{result.polling_unit.polling_unit_name}}</h3><table><tr><th>Party</th><th>Score</th></tr>{% for r in result.rows %}<tr><td>{{r.party}}</td><td>{{r.score}}</td></tr>{% endfor %}<tr><th>Total</th><th>{{result.total}}</th></tr></table></div>{% endif %}{% endblock %}
